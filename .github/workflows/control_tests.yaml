name: Pytest & Ruff control Push
on: push
jobs:
  qa:
    name: Check tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout on main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@master
        with:
          python-version: "3.x"
      
      - name: Install pytest and Ruff
        run: |
          pip install pytest
          pip install ruff

      - name: Run tests
        run: |
          pytest

      - name: Run Ruff
        run: ruff check .
